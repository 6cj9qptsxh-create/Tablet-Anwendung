substitutions:
  name: reterminal-e1001
  friendly_name: E1001

  wz_temp: sensor.sonoff_temperatursensor_snzb_02p_temperatur_2
  wz_hum: sensor.sonoff_temperatursensor_snzb_02p_luftfeuchtigkeit_2
  terr_temp: sensor.sonoff_temperatursensor_snzb_02p_temperatur
  terr_hum: sensor.sonoff_temperatursensor_snzb_02p_luftfeuchtigkeit
  agenda_shifts: sensor.e1001_schichten
  agenda_notes: sensor.e1001_termine
  agenda_birthdays: sensor.e1001_geburtstage
  weather_days: sensor.e1001_wetter_tage
  weather_hours: sensor.e1001_wetter_stunden
  presence: binary_sensor.e1001_jemand_da

  # Nur wenn niemand da: zwei Zeitfenster mit kurzem Pruefintervall, sonst lang.
  # Stunde inkl. from, exkl. until. Gleiche from/until = Fenster aus.
  # Ueber Mitternacht: z.B. 22 und 7. Jemand-da an: immer 15 Min inkl. Bild.
  away_short_min: "15"
  away_long_min: "60"
  short_a_from: "5"
  short_a_until: "9"
  short_b_from: "15"
  short_b_until: "19"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
        - delay: 200ms
        - lambda: |-
            id(woke_by_button) = (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1);
            id(ignore_wake_press) = id(woke_by_button);
            if (id(woke_by_button)) {
              uint64_t bits = esp_sleep_get_ext1_wakeup_status();
              // Weisse Tasten GPIO4 und GPIO5: Seite wechseln. Gruen GPIO3 nur zeichnen.
              if ((bits & (1ULL << 4)) || (bits & (1ULL << 5)))
                id(page_index) = (id(page_index) + 1) % 2;
            }
    # WLAN/HA abwarten, zeichnen, nach dem Refresh schlafen — nicht extra 55s offen bleiben.
    - priority: -100
      then:
        - wait_until:
            condition:
              api.connected
            timeout: 12s
        - wait_until:
            condition:
              lambda: return id(wz_temp).has_state();
            timeout: 4s
        - wait_until:
            condition:
              lambda: return id(jemand_da).has_state();
            timeout: 4s
        - delay: 1s
        - script.execute: maybe_redraw_then_sleep

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

# Der CH340K der reTerminal-E-Serie haengt auf UART0; ohne das gehen die Logs ins Leere.
logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - deep_sleep.prevent: deep_sleep_ctrl

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "E1001-Setup"
    password: "hausmeli123"

captive_portal:

deep_sleep:
  id: deep_sleep_ctrl
  sleep_duration: 15min
  # Nur Fallsicherung, falls das Script haengt. Schlafen passiert nach dem 6s-Refresh.
  run_duration: 55s
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO3
        allow_other_uses: true
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true

switch:
  - platform: template
    name: "OTA wach halten"
    id: keep_awake
    icon: mdi:coffee
    restore_mode: ALWAYS_OFF
    optimistic: true
    entity_category: config
    turn_on_action:
      - deep_sleep.prevent: deep_sleep_ctrl
    turn_off_action:
      - deep_sleep.allow: deep_sleep_ctrl

script:
  - id: go_sleep
    then:
      - if:
          condition:
            switch.is_off: keep_awake
          then:
            - deep_sleep.enter:
                id: deep_sleep_ctrl
                sleep_duration: 15min
  - id: go_sleep_away
    then:
      - if:
          condition:
            switch.is_off: keep_awake
          then:
            - deep_sleep.enter:
                id: deep_sleep_ctrl
                sleep_duration: !lambda |-
                  auto in_window = [](int h, int from, int until) -> bool {
                    if (from == until) return false;
                    if (from < until) return h >= from && h < until;
                    return h >= from || h < until;
                  };
                  auto t = id(ha_time).now();
                  const uint32_t short_ms = ${away_short_min}UL * 60UL * 1000UL;
                  const uint32_t long_ms = ${away_long_min}UL * 60UL * 1000UL;
                  if (!t.is_valid())
                    return short_ms;
                  const int h = t.hour;
                  if (in_window(h, ${short_a_from}, ${short_a_until})
                      || in_window(h, ${short_b_from}, ${short_b_until}))
                    return short_ms;
                  return long_ms;
  - id: redraw_then_sleep
    mode: restart
    then:
      # Nach WLAN, vor dem Display-Refresh: Last ist ruhiger, weniger Spannungseinbruch.
      - repeat:
          count: 5
          then:
            - component.update: battery_voltage
            - delay: 40ms
      - delay: 20ms
      - component.update: epaper_display
      - delay: 6s
      # Kurz wach bleiben, damit eine weitere Taste nicht ins Deep Sleep faellt.
      - delay: 8s
      - script.execute: go_sleep
  - id: maybe_redraw_then_sleep
    mode: restart
    then:
      - if:
          condition:
            or:
              - lambda: return id(woke_by_button);
              - lambda: return !id(jemand_da).has_state();
              - binary_sensor.is_on: jemand_da
          then:
            - lambda: id(ignore_wake_press) = false;
            - script.execute: redraw_then_sleep
          else:
            - lambda: id(ignore_wake_press) = false;
            - script.execute: go_sleep_away

globals:
  - id: page_index
    type: int
    restore_value: yes
    initial_value: "0"
  - id: woke_by_button
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ignore_wake_press
    type: bool
    restore_value: no
    initial_value: "false"
  # Letzter angezeigter Akkustand. Ueberlebt Deep Sleep — wie beim Handy nur eine Richtung.
  - id: batt_shown
    type: int
    restore_value: yes
    initial_value: "-1"

# GPIO21 schaltet die interne Spannungsteiler-Bruecke fuer den Akku ein.
output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Vienna

sensor:
  - platform: homeassistant
    id: wz_temp
    entity_id: ${wz_temp}
  - platform: homeassistant
    id: wz_hum
    entity_id: ${wz_hum}
  - platform: homeassistant
    id: terr_temp
    entity_id: ${terr_temp}
  - platform: homeassistant
    id: terr_hum
    entity_id: ${terr_hum}

  # GPIO1 liest die halbierte Akkuspannung; *2 macht daraus die echte Zellenspannung.
  - platform: adc
    pin: GPIO1
    name: "Akku Spannung"
    id: battery_voltage
    update_interval: 300s
    attenuation: 12db
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    entity_category: diagnostic
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
    on_value:
      then:
        - component.update: battery_level

  - platform: template
    name: "Akku"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (isnan(id(battery_voltage).state)) return {};
      return id(battery_voltage).state;
    filters:
      - calibrate_linear:
          - 3.27 -> 0.0
          - 3.30 -> 5.0
          - 3.41 -> 10.0
          - 3.49 -> 20.0
          - 3.58 -> 30.0
          - 3.68 -> 40.0
          - 3.75 -> 50.0
          - 3.80 -> 60.0
          - 3.85 -> 70.0
          - 3.91 -> 80.0
          - 3.96 -> 90.0
          - 4.15 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
      # Wie ein Handy: beim Entladen nur nach unten, kleine Rauscher und Einbrueche ignorieren.
      - lambda: |-
          int raw = (int) (x + 0.5f);
          if (raw < 0) raw = 0;
          if (raw > 100) raw = 100;
          int last = id(batt_shown);
          int shown = raw;
          if (last >= 0) {
            if (raw < last - 12) shown = last;
            else if (raw <= last - 2) shown = raw;
            else if (raw >= last + 4) shown = raw;
            else shown = last;
          }
          id(batt_shown) = shown;
          return shown;

text_sensor:
  - platform: homeassistant
    id: schichten_text
    entity_id: ${agenda_shifts}
    attribute: shifts_text
  - platform: homeassistant
    id: termine_text
    entity_id: ${agenda_notes}
    attribute: notes_text
  - platform: homeassistant
    id: geburtstage_text
    entity_id: ${agenda_birthdays}
    attribute: birthdays_text
  - platform: homeassistant
    id: wetter_tage_text
    entity_id: ${weather_days}
    attribute: days_text
  - platform: homeassistant
    id: wetter_stunden_text
    entity_id: ${weather_hours}
    attribute: hours_text

binary_sensor:
  - platform: homeassistant
    id: jemand_da
    entity_id: ${presence}
    name: "Jemand da"
  # Gruen, ganz rechts: aktuelle Seite neu zeichnen (GPIO3 / KEY0).
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: taste_gruen
    name: "Aktualisieren"
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - if:
            condition:
              lambda: return id(ignore_wake_press);
            then:
              - lambda: id(ignore_wake_press) = false;
            else:
              - script.execute: redraw_then_sleep
  # Rechte weisse Taste: Seite umschalten.
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: taste_rechts
    name: "Seite weiter"
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - if:
            condition:
              lambda: return id(ignore_wake_press);
            then:
              - lambda: id(ignore_wake_press) = false;
            else:
              - lambda: id(page_index) = (id(page_index) + 1) % 2;
              - script.execute: redraw_then_sleep
  # Linke weisse Taste: Seite umschalten.
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: taste_links
    name: "Seite umschalten"
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - if:
            condition:
              lambda: return id(ignore_wake_press);
            then:
              - lambda: id(ignore_wake_press) = false;
            else:
              - lambda: id(page_index) = (id(page_index) + 1) % 2;
              - script.execute: redraw_then_sleep

font:
  # "–" und "…" liefert der Agenda-Feed mit; ohne die Glyphen bleiben dort Luecken.
  - file: "gfonts://Inter@700"
    id: font_label
    size: 18
    glyphs: &de_glyphs
      - " !%&()+,-_./:?=°–…"
      - "0123456789"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyzäöüß"
      - "ÄÖÜ"
  # Schmaler als Inter, damit 23.5° in der linken Spalte bleibt.
  - file: "gfonts://Roboto Condensed@700"
    id: font_huge
    size: 70
    glyphs: " -.,0123456789°"
  - file: "gfonts://Inter@700"
    id: font_hum
    size: 36
    glyphs: *de_glyphs
  - file: "gfonts://Inter@700"
    id: font_date
    size: 36
    glyphs: *de_glyphs
  - file: "gfonts://Roboto Condensed@500"
    id: font_meta
    size: 21
    glyphs: *de_glyphs
  # Gleiche Buchstabenbreite, schmal: Tageskuerzel wie Mo/Di stehen damit auf einer Linie.
  - file: "gfonts://Roboto Mono@500"
    id: font_day
    size: 18
    glyphs: *de_glyphs
  - file: "gfonts://Inter@700"
    id: font_desc
    size: 24
    glyphs: *de_glyphs
  - file: "gfonts://Inter@700"
    id: font_name
    size: 21
    glyphs: *de_glyphs
  - file: "gfonts://Roboto Mono@700"
    id: font_badge
    size: 16
    glyphs: "ML"
  - file: "gfonts://Roboto Condensed@500"
    id: font_shift
    size: 22
    glyphs: *de_glyphs

display:
  - platform: waveshare_epaper
    id: epaper_display
    # Gegen das Flackern: auf 7.50inv2p wechseln und full_update_every: 12 ergaenzen.
    # Das Modell kann Teilaktualisierungen, setzt aber ein Panel ab Fertigung 09/2023 voraus.
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-
      // Dieses Panel zeigt invertiert: BLACK ergibt weisse Flaeche, WHITE ergibt schwarze Tinte.
      const Color BG = Color::BLACK;
      const Color FG = Color::WHITE;

      // Kartenlayout 800x480, Schatten nach rechts unten (E-Paper: nur SW, daher versetzter Block).
      const int shadow_off = 5;
      const int pad = 10;
      const int LEFT_X = 10;
      const int LEFT_W = 218;
      const int MID_X = 240;
      const int MID_W = 258;
      const int RIGHT_X = 510;
      const int RIGHT_W = 276;
      const int CARD_Y = 10;
      const int CARD_H = 456;
      const int RIGHT_TOP_H = 268;
      const int RIGHT_BOT_Y = 290;
      const int RIGHT_BOT_H = 176;
      const int BOTTOM = CARD_Y + CARD_H;

      it.fill(BG);

      auto text_w = [&](const std::string &s, auto *font) {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, s.c_str(), font, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        return w;
      };

      auto clip = [&](std::string s, int max_w, auto *font) {
        if (text_w(s, font) <= max_w) return s;
        while (!s.empty()) {
          s.pop_back();
          // Angebrochene UTF-8-Sequenz mitentfernen, sonst zerreisst es Umlaute.
          while (!s.empty() && (static_cast<unsigned char>(s.back()) & 0xC0) == 0x80) s.pop_back();
          if (text_w(s + "…", font) <= max_w) return s + "…";
        }
        return s;
      };

      // Grau auf 1-Bit: nur jedes zweite Pixel setzen (Schatten).
      auto dither_rect = [&](int x, int y, int w, int h) {
        if (w < 2 || h < 2) return;
        const int x1 = x + w;
        const int y1 = y + h;
        for (int py = y; py < y1; py++) {
          for (int px = x; px < x1; px++) {
            if (((px + py) & 1) != 0) continue;
            it.draw_pixel_at(px, py, FG);
          }
        }
      };

      // Morgen: jedes achte Pixel, heller als Heute.
      auto dither_pale = [&](int x, int y, int w, int h) {
        if (w < 2 || h < 2) return;
        const int x1 = x + w;
        const int y1 = y + h;
        for (int py = y; py < y1; py++) {
          for (int px = x; px < x1; px++) {
            if ((px & 3) != 0 || (py & 1) != 0) continue;
            it.draw_pixel_at(px, py, FG);
          }
        }
      };

      // Heute, fuer Termine, Geburtstage und Schichten: jedes vierte Pixel.
      auto dither_light = [&](int x, int y, int w, int h) {
        if (w < 2 || h < 2) return;
        const int x1 = x + w;
        const int y1 = y + h;
        for (int py = y; py < y1; py++) {
          for (int px = x; px < x1; px++) {
            if ((px & 1) != 0 || (py & 1) != 0) continue;
            it.draw_pixel_at(px, py, FG);
          }
        }
      };

      auto card = [&](int x, int y, int w, int h) {
        // Schatten nur als Raster; die Karte deckt die linke/obere Seite wieder zu.
        dither_rect(x + shadow_off, y + shadow_off, w, h);
        it.filled_rectangle(x, y, w, h, FG);
        it.filled_rectangle(x + 1, y + 1, w - 2, h - 2, BG);
      };

      auto section = [&](int x, int y, int w, const char *title) {
        it.filled_rectangle(x, y, w, 28, FG);
        it.print(x + 6, y + 5, id(font_label), BG, title);
      };

      auto weather_icon = [&](int cx, int cy, int size, const std::string &cond) {
        std::string c = cond;
        for (char &ch : c)
          if (ch >= 'A' && ch <= 'Z') ch = static_cast<char>(ch + 32);
        bool storm = c.find("gewitter") != std::string::npos || c.find("lightning") != std::string::npos;
        bool snow = c.find("schnee") != std::string::npos || c.find("snow") != std::string::npos;
        bool pour = c.find("pour") != std::string::npos;
        bool rain = pour || c.find("regen") != std::string::npos || c.find("rain") != std::string::npos ||
                    c.find("hagel") != std::string::npos;
        bool fog = c.find("nebel") != std::string::npos || c.find("fog") != std::string::npos;
        bool windy = c.find("wind") != std::string::npos;
        bool mix = c.find("wolkig") != std::string::npos || c.find("partly") != std::string::npos;
        bool cloud = mix || c.find("bewoelkt") != std::string::npos || c.find("cloudy") != std::string::npos;
        bool nacht = c.find("nacht") != std::string::npos || c.find("night") != std::string::npos;
        bool night = nacht || c.find("klar") != std::string::npos;

        auto stroke = [&](int x1, int y1, int x2, int y2) {
          it.line(x1, y1, x2, y2, FG);
          it.line(x1 + 1, y1, x2 + 1, y2, FG);
          it.line(x1, y1 + 1, x2, y2 + 1, FG);
        };
        auto ring = [&](int x, int y, int r, int t) {
          if (r < 3) r = 3;
          if (t < 2) t = 2;
          it.filled_circle(x, y, r, FG);
          it.filled_circle(x, y, r - t, BG);
        };
        auto cloud_blob = [&](int x, int y, int s, Color col) {
          if (s < 14) s = 14;
          int r_left = s * 28 / 100;
          int r_right = s * 34 / 100;
          int r_mid = s * 23 / 100;
          int x_left = x - s * 24 / 100;
          int x_right = x + s * 20 / 100;
          int x_mid = x - s * 2 / 100;
          int y_mid = y - s * 20 / 100;
          it.filled_circle(x_left, y, r_left, col);
          it.filled_circle(x_right, y - s * 5 / 100, r_right, col);
          it.filled_circle(x_mid, y_mid, r_mid, col);
          int body_x = x_left - r_left / 5;
          int body_w = (x_right + r_right) - body_x;
          it.filled_rectangle(body_x, y, body_w, r_right * 3 / 4, col);
        };
        auto outline_cloud = [&](int x, int y, int s) {
          cloud_blob(x, y, s, FG);
          cloud_blob(x, y + 1, s - (s >= 40 ? 9 : 7), BG);
        };
        auto outline_sun = [&](int x, int y, int r) {
          ring(x, y, r, 2);
          int inner = r + 3;
          int outer = r + (r < 10 ? 7 : 10);
          it.filled_rectangle(x - 1, y - outer, 3, outer - inner, FG);
          it.filled_rectangle(x - 1, y + inner, 3, outer - inner, FG);
          it.filled_rectangle(x - outer, y - 1, outer - inner, 3, FG);
          it.filled_rectangle(x + inner, y - 1, outer - inner, 3, FG);
          int d1 = inner * 71 / 100;
          int d2 = outer * 71 / 100;
          stroke(x + d1, y - d1, x + d2, y - d2);
          stroke(x + d1, y + d1, x + d2, y + d2);
          stroke(x - d1, y + d1, x - d2, y + d2);
          stroke(x - d1, y - d1, x - d2, y - d2);
        };
        auto rain_drops = [&](int x, int y, int s, int n) {
          for (int i = 0; i < n; i++) {
            int px = x - s / 4 + i * (s / (n + 1));
            int py = y + s / 5 + (i % 2) * 2;
            stroke(px, py, px - 3, py + s / 5);
          }
        };
        auto flake = [&](int x, int y, int r) {
          it.line(x - r, y, x + r, y, FG);
          it.line(x, y - r, x, y + r, FG);
          it.line(x - r * 2 / 3, y - r * 2 / 3, x + r * 2 / 3, y + r * 2 / 3, FG);
          it.line(x - r * 2 / 3, y + r * 2 / 3, x + r * 2 / 3, y - r * 2 / 3, FG);
        };

        if (fog) {
          auto bar = [&](int y, int xoff, int w) {
            int x = cx - w / 2 + xoff;
            it.filled_circle(x, y, 2, FG);
            it.filled_rectangle(x, y - 2, w, 4, FG);
            it.filled_circle(x + w, y, 2, FG);
          };
          bar(cy - 10, 0, size * 6 / 10);
          bar(cy - 1, 6, size * 5 / 10);
          bar(cy + 8, 2, size * 6 / 10);
          return;
        }
        if (storm) {
          outline_cloud(cx, cy - size / 8, size * 8 / 10);
          int bx = cx + 2, by = cy + size / 10;
          stroke(bx, by, bx + 8, by + 9);
          stroke(bx + 8, by + 9, bx - 2, by + 9);
          stroke(bx - 2, by + 9, bx + 7, by + 20);
          return;
        }
        if (snow) {
          outline_cloud(cx, cy - size / 7, size * 8 / 10);
          int fy = cy + size / 4;
          flake(cx - size / 5, fy, 4);
          flake(cx + 2, fy + 3, 4);
          flake(cx + size / 5, fy, 3);
          return;
        }
        if (rain) {
          outline_cloud(cx, cy - size / 7, size * 8 / 10);
          rain_drops(cx, cy + size / 12, size, pour ? 5 : 3);
          return;
        }
        if (nacht && !cloud) {
          int r = size / 3;
          it.filled_circle(cx, cy, r, FG);
          it.filled_circle(cx, cy, r - 2, BG);
          it.filled_circle(cx + r / 3, cy - r / 8, r - 3, BG);
          return;
        }
        if (nacht) {
          int r = size / 4;
          int mx = cx - size / 5;
          it.filled_circle(mx, cy - size / 8, r, FG);
          it.filled_circle(mx, cy - size / 8, r - 2, BG);
          it.filled_circle(mx + r / 3, cy - size / 8 - r / 8, r - 3, BG);
          outline_cloud(cx + size / 8, cy + size / 10, size * 62 / 100);
          return;
        }
        if (mix) {
          outline_sun(cx - size / 4, cy - size / 5, size / 5);
          outline_cloud(cx + size / 10, cy + size / 12, size * 72 / 100);
          return;
        }
        if (cloud) {
          outline_cloud(cx, cy, size * 9 / 10);
          return;
        }
        if (windy) {
          auto wbar = [&](int y, int xoff, int w) {
            int x = cx - w / 2 + xoff;
            it.filled_rectangle(x, y - 1, w, 3, FG);
            it.circle(x + w + 3, y - 3, 4, FG);
            it.circle(x + w + 3, y - 3, 3, FG);
          };
          wbar(cy - 8, 0, size / 2);
          wbar(cy, 8, size / 2 + 4);
          wbar(cy + 8, 2, size / 2);
          return;
        }
        if (night) {
          int r = size / 3;
          it.filled_circle(cx, cy, r, FG);
          it.filled_circle(cx, cy, r - 2, BG);
          it.filled_circle(cx + r / 3, cy - r / 8, r - 3, BG);
          return;
        }
        outline_sun(cx, cy, size / 3);
      };

      auto hrule = [&](int x, int y, int w) {
        it.filled_rectangle(x, y, w, 1, FG);
      };

      auto split_entries = [](const std::string &text) {
        std::vector<std::string> entries;
        std::string cur;
        auto flush = [&]() {
          size_t a = cur.find_first_not_of(" \t");
          size_t b = cur.find_last_not_of(" \t");
          if (a != std::string::npos) entries.push_back(cur.substr(a, b - a + 1));
          cur.clear();
        };
        for (size_t i = 0; i < text.size(); i++) {
          char c = text[i];
          if (c == '\n' || c == '\r') { flush(); continue; }
          // Der REST-Feed liefert Umbrueche teils als Literal "\n" statt als Steuerzeichen.
          if (c == '\\' && i + 1 < text.size() && (text[i + 1] == 'n' || text[i + 1] == 'r')) {
            flush();
            i++;
            continue;
          }
          cur += c;
        }
        flush();
        return entries;
      };

      // FamilyAgendaFeed trennt die Felder einer Zeile mit zwei Leerzeichen.
      auto split_fields = [](const std::string &line) {
        std::vector<std::string> f;
        size_t start = 0;
        while (true) {
          size_t pos = line.find("  ", start);
          if (pos == std::string::npos) {
            f.push_back(line.substr(start));
            break;
          }
          f.push_back(line.substr(start, pos - start));
          start = pos + 2;
          while (start < line.size() && line[start] == ' ') start++;
        }
        return f;
      };

      auto wrap = [&](const std::string &entry, int max_w, auto *font, std::vector<std::string> &out) {
        std::vector<std::string> words;
        std::string cur;
        for (char c : entry) {
          if (c == ' ') {
            if (!cur.empty()) { words.push_back(cur); cur.clear(); }
          } else {
            cur += c;
          }
        }
        if (!cur.empty()) words.push_back(cur);

        std::string line;
        for (auto &word : words) {
          if (line.empty()) {
            line = text_w(word, font) > max_w ? clip(word, max_w, font) : word;
            continue;
          }
          std::string cand = line + " " + word;
          if (text_w(cand, font) <= max_w) {
            line = cand;
          } else {
            out.push_back(line);
            line = text_w(word, font) > max_w ? clip(word, max_w, font) : word;
          }
        }
        if (!line.empty()) out.push_back(line);
      };

      auto upper_day = [](std::string s) {
        auto sp = s.find(' ');
        if (sp == std::string::npos || sp > 3) return s;
        for (size_t i = 0; i < sp; i++) {
          if (s[i] >= 'a' && s[i] <= 'z') s[i] = static_cast<char>(s[i] - 32);
        }
        return s;
      };

      auto date_width = [&](const std::string &s) {
        int w = 0;
        std::string run;
        auto flush = [&](bool dot) {
          if (run.empty()) return;
          w += text_w(run, id(font_day));
          run.clear();
        };
        for (char c : s) {
          bool is_dot = c == '.';
          if (!run.empty() && is_dot != (run[0] == '.')) flush(run[0] == '.');
          run += c;
        }
        if (!run.empty()) flush(run[0] == '.');
        return w;
      };

      auto print_date = [&](int x, int y, const std::string &s) {
        std::string run;
        auto flush = [&](bool dot) {
          if (run.empty()) return;
          auto *font = id(font_day);
          it.print(x, y, font, FG, run.c_str());
          x += text_w(run, font);
          run.clear();
        };
        for (char c : s) {
          bool is_dot = c == '.';
          if (!run.empty() && is_dot != (run[0] == '.')) flush(run[0] == '.');
          run += c;
        }
        if (!run.empty()) flush(run[0] == '.');
        return x;
      };

      const int left_x = LEFT_X + pad;
      const int left_w = LEFT_W - 2 * pad;
      const int mid_x = MID_X + pad;
      const int mid_w = MID_W - 2 * pad;
      const int mid_right = mid_x + mid_w;
      const int right_x = RIGHT_X + pad;
      const int right_w = RIGHT_W - 2 * pad;
      const int right_edge = right_x + right_w;
      // Gleicher Rand wie der Titeltext in section() — klein, sonst wirkt die Spalte leer.
      const int inset = 6;

      auto draw_battery = [&](int edge_x, int top_y) {
        int batt_pct = -1;
        if (id(batt_shown) >= 0) {
          batt_pct = id(batt_shown);
        } else if (!isnan(id(battery_level).state)) {
          float pct = id(battery_level).state;
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          batt_pct = (int) (pct + 0.5f);
        }
        char batt_label[8];
        if (batt_pct < 0)
          snprintf(batt_label, sizeof(batt_label), "--");
        else
          snprintf(batt_label, sizeof(batt_label), "%d%%", batt_pct);

        const int ICON_W = 24;
        const int ICON_H = 12;
        const int NUB_W = 2;
        const int NUB_H = 5;
        int label_w = text_w(std::string(batt_label), id(font_meta));
        int icon_x = edge_x - label_w - 8 - ICON_W - NUB_W;
        int icon_y = top_y + 4;
        it.rectangle(icon_x, icon_y, ICON_W, ICON_H, FG);
        it.filled_rectangle(icon_x + ICON_W, icon_y + (ICON_H - NUB_H) / 2, NUB_W, NUB_H, FG);
        if (batt_pct > 0) {
          int inner = ICON_W - 4;
          int fill = inner * batt_pct / 100;
          if (fill < 1) fill = 1;
          if (fill > inner) fill = inner;
          it.filled_rectangle(icon_x + 2, icon_y + 2, fill, ICON_H - 4, FG);
        }
        it.print(edge_x, top_y, id(font_meta), FG, TextAlign::TOP_RIGHT, batt_label);
      };

      if (id(page_index) == 0) {
      card(LEFT_X, CARD_Y, LEFT_W, CARD_H);
      card(MID_X, CARD_Y, MID_W, CARD_H);
      card(RIGHT_X, CARD_Y, RIGHT_W, RIGHT_TOP_H);
      card(RIGHT_X, RIGHT_BOT_Y, RIGHT_W, RIGHT_BOT_H);

      // ----- Links: Sensoren in zwei Bloecken -----
      auto drawn = id(ha_time).now();
      if (drawn.is_valid())
        it.strftime(left_x, CARD_Y + pad, id(font_meta), FG, "aktualisiert %H:%M", drawn);
      else
        it.print(left_x, CARD_Y + pad, id(font_meta), FG, "aktualisiert --:--");

      section(left_x, CARD_Y + pad + 37, left_w, "WOHNZIMMER");
      if (!isnan(id(wz_temp).state))
        it.printf(left_x, CARD_Y + 80, id(font_huge), FG, "%.1f°", id(wz_temp).state);
      else
        it.print(left_x, CARD_Y + 80, id(font_huge), FG, "--");
      if (!isnan(id(wz_hum).state))
        it.printf(left_x, CARD_Y + 176, id(font_hum), FG, "%.0f %%", id(wz_hum).state);

      section(left_x, 244, left_w, "TERRASSE");
      if (!isnan(id(terr_temp).state))
        it.printf(left_x, 282, id(font_huge), FG, "%.1f°", id(terr_temp).state);
      else
        it.print(left_x, 282, id(font_huge), FG, "--");
      if (!isnan(id(terr_hum).state))
        it.printf(left_x, 378, id(font_hum), FG, "%.0f %%", id(terr_hum).state);

      // ----- Mitte: Termine -----
      section(mid_x, CARD_Y + pad, mid_w, "TERMINE");

      auto note_entries = split_entries(id(termine_text).has_state() ? id(termine_text).state : "");
      int note_y = CARD_Y + 52;
      size_t notes_shown = 0;
      for (auto &line : note_entries) {
        auto f = split_fields(line);
        std::string date, time, title, who;
        if (f.size() >= 3) {
          date = f[0];
          time = f[1];
          title = f[2];
          for (size_t i = 3; i < f.size(); i++) {
            bool mark = (i + 1 == f.size()) && (f[i] == "M" || f[i] == "L" || f[i] == "ML" || f[i] == "LM");
            if (mark) {
              if (f[i].find('M') != std::string::npos) who = "M";
              if (f[i].find('L') != std::string::npos) who += "L";
            } else {
              title += " ";
              title += f[i];
            }
          }
        } else {
          title = line;
        }
        date = upper_day(date);

        const int badge_r = 12;
        bool has_m = who.find('M') != std::string::npos;
        bool has_l = who.find('L') != std::string::npos;
        int badge_stack = 0;
        if (has_m && has_l)
          badge_stack = badge_r * 2 + 16;
        else if (has_m || has_l)
          badge_stack = badge_r * 2;
        int badge_pad = badge_stack ? badge_r * 2 + 4 : 0;
        std::vector<std::string> desc;
        if (!title.empty()) wrap(title, mid_w - 2 * inset - badge_pad, id(font_name), desc);
        if (desc.size() > 2) desc.resize(2);

        int title_h = (int) desc.size() * 25;
        if (badge_stack > title_h) title_h = badge_stack;
        int need = (date.empty() ? 0 : 26) + title_h + 10;
        if (note_y + need > BOTTOM - 18) break;

        bool is_today = (date == "Heute");
        bool is_tomorrow = (date == "Morgen");
        if (is_today || is_tomorrow) {
          int bg_h = (date.empty() ? 0 : 26) + title_h + 6;
          if (is_today)
            dither_light(mid_x, note_y - 3, mid_w, bg_h);
          else
            dither_pale(mid_x, note_y - 3, mid_w, bg_h);
        } else if (notes_shown > 0) {
          hrule(mid_x, note_y - 8, mid_w);
        }

        if (!date.empty()) {
          print_date(mid_x + inset, note_y, date);
          if (!time.empty())
            it.print(mid_right - inset, note_y, id(font_day), FG, TextAlign::TOP_RIGHT, time.c_str());
          note_y += 26;
        }
        int title_y = note_y;
        for (size_t li = 0; li < desc.size(); li++)
          it.print(mid_x + inset, title_y + (int) li * 25, id(font_name), FG, desc[li].c_str());
        if (badge_stack && !desc.empty()) {
          int cx = mid_right - inset - badge_r;
          int stack_top = title_y + (title_h - badge_stack) / 2;
          auto disc = [&](int cy, const char *letter) {
            it.filled_circle(cx, cy, badge_r, FG);
            int x1, y1, tw, th;
            it.get_text_bounds(0, 0, letter, id(font_badge), TextAlign::TOP_LEFT, &x1, &y1, &tw, &th);
            it.print(cx - (x1 + tw / 2), cy - (y1 + th / 2), id(font_badge), BG, TextAlign::TOP_LEFT, letter);
          };
          if (has_l)
            disc(stack_top + badge_r + (has_m ? 16 : 0), "L");
          if (has_m)
            disc(stack_top + badge_r, "M");
        }
        note_y = title_y + title_h + 12;
        notes_shown++;
      }
      if (notes_shown == 0) {
        it.print(mid_x + inset, CARD_Y + 52, id(font_name), FG, "keine Termine");
      }

      // ----- Rechts oben: Datum, Akku, Geburtstage -----
      auto now = id(ha_time).now();
      if (now.is_valid()) {
        static const char *WOCHENTAGE[] = {"SONNTAG",   "MONTAG",  "DIENSTAG", "MITTWOCH",
                                           "DONNERSTAG", "FREITAG", "SAMSTAG"};
        int dow = now.day_of_week - 1;
        if (dow >= 0 && dow < 7)
          it.print(right_x, CARD_Y + pad, id(font_label), FG, WOCHENTAGE[dow]);
        it.strftime(right_x, CARD_Y + pad + 22, id(font_date), FG, "%d.%m.%Y", now);
      }

      draw_battery(right_edge, CARD_Y + pad);

      section(right_x, CARD_Y + 84, right_w, "GEBURTSTAGE");

      auto bday_entries = split_entries(id(geburtstage_text).has_state() ? id(geburtstage_text).state : "");
      int bday_y = CARD_Y + 120;
      int bday_max = CARD_Y + RIGHT_TOP_H - 18;
      const int col_gap = 8;
      const int date_col = date_width(std::string("DO 01.10.")) > date_width(std::string("Morgen"))
                               ? date_width(std::string("DO 01.10."))
                               : date_width(std::string("Morgen"));
      const int age_col = text_w(std::string("000J"), id(font_day));
      size_t bdays_shown = 0;
      for (auto &line : bday_entries) {
        if (bday_y + 28 > bday_max) break;
        auto f = split_fields(line);
        std::string date, who, age;
        if (f.size() >= 3) {
          date = f[0];
          who = f[1];
          age = f[2];
        } else if (f.size() >= 2) {
          date = f[0];
          who = f[1];
        } else {
          who = line;
        }
        date = upper_day(date);

        const std::string prefix = "Geburtstag";
        if (who.compare(0, prefix.size(), prefix) == 0) {
          who.erase(0, prefix.size());
          while (!who.empty() && (who.front() == ' ' || who.front() == ':')) who.erase(0, 1);
        }

        bool is_today = (date == "Heute");
        bool is_tomorrow = (date == "Morgen");
        if (is_today) {
          dither_light(right_x, bday_y - 3, right_w, 30);
        } else if (is_tomorrow) {
          dither_pale(right_x, bday_y - 3, right_w, 30);
        } else if (bdays_shown > 0)
          hrule(right_x, bday_y - 6, right_w);

        int col1 = right_x + inset;
        int col2 = col1 + date_col + col_gap;
        int col3 = col2 + age_col + 3;
        if (!date.empty())
          print_date(col1, bday_y + 2, date);
        if (!age.empty())
          it.print(col2, bday_y + 2, id(font_day), FG, age.c_str());
        int name_room = right_edge - inset - col3;
        if (name_room < 36) name_room = 36;
        it.print(col3, bday_y, id(font_name), FG, clip(who, name_room, id(font_name)).c_str());
        bday_y += 34;
        bdays_shown++;
      }
      if (bdays_shown == 0) {
        it.print(right_x + inset, CARD_Y + 120, id(font_name), FG, "keine Geburtstage");
      }

      // ----- Rechts unten: Schichten -----
      section(right_x, RIGHT_BOT_Y + pad, right_w, "SCHICHTEN");

      auto shift_entries = split_entries(id(schichten_text).has_state() ? id(schichten_text).state : "");
      int shift_y = RIGHT_BOT_Y + 50;
      size_t shifts_shown = 0;
      for (auto &line : shift_entries) {
        if (shifts_shown >= 3) break;
        auto f = split_fields(line);
        std::string date, kind;
        if (f.size() >= 3) {
          date = f[0];
          kind = f[2];
        } else {
          date = line;
        }
        date = upper_day(date);
        bool is_today = (date == "Heute");
        bool is_tomorrow = (date == "Morgen");
        if (is_today) {
          dither_light(right_x, shift_y - 3, right_w, 34);
        } else if (is_tomorrow) {
          dither_pale(right_x, shift_y - 3, right_w, 34);
        } else if (shifts_shown > 0)
          hrule(right_x, shift_y - 8, right_w);
        int kind_room = right_w - 2 * inset - date_col - col_gap;
        if (kind_room < 36) kind_room = 36;
        if (!date.empty())
          print_date(right_x + inset, shift_y + 2, date);
        if (!kind.empty())
          it.print(right_x + inset + date_col + col_gap, shift_y, id(font_name), FG,
                   clip(kind, kind_room, id(font_name)).c_str());
        shift_y += 38;
        shifts_shown++;
      }
      if (shifts_shown == 0)
        it.print(right_x + inset, RIGHT_BOT_Y + 50, id(font_name), FG, "keine Schichten");
      } else {
      // ----- Seite 2: Wetter, ohne Innen-/Aussentemperatur -----
      const int FULL_X = 10;
      const int FULL_W = 776;
      const int TOP_H = 214;
      const int BOT_Y = 238;
      const int BOT_H = 228;
      const int inner_x = FULL_X + pad;
      const int inner_w = FULL_W - 2 * pad;

      card(FULL_X, CARD_Y, FULL_W, TOP_H);
      card(FULL_X, BOT_Y, FULL_W, BOT_H);

      auto liter = [](std::string rain) {
        if (rain == "-" || rain.empty()) return std::string("–");
        auto pos = rain.find("L/m");
        if (pos != std::string::npos) {
          rain.replace(pos, std::string::npos, "L");
          return rain;
        }
        if (rain.size() >= 2 && rain.compare(rain.size() - 2, 2, "mm") == 0)
          rain.replace(rain.size() - 2, 2, "L");
        else if (rain.find('L') == std::string::npos)
          rain += " L";
        return rain;
      };

      auto day_entries = split_entries(id(wetter_tage_text).has_state() ? id(wetter_tage_text).state : "");
      if (!id(wetter_tage_text).has_state()) {
        it.print(inner_x, CARD_Y + 70, id(font_desc), FG, "warte auf Home Assistant");
      } else if (day_entries.empty()) {
        it.print(inner_x, CARD_Y + 70, id(font_desc), FG, "kein Wetter");
      } else {
        if (day_entries.size() > 5) day_entries.resize(5);
        int col_w = inner_w / (int) day_entries.size();
        std::vector<std::string> nights;
        for (size_t i = 0; i < day_entries.size(); i++) {
          auto f = split_fields(day_entries[i]);
          std::string day = f.size() > 0 ? f[0] : "";
          std::string cond = f.size() > 1 ? f[1] : "";
          std::string high = f.size() > 2 ? f[2] : "";
          std::string low = f.size() > 3 ? f[3] : "";
          std::string rain = f.size() > 5 ? f[5] : "";
          std::string sun = f.size() > 6 ? f[6] : "";
          std::string wind = f.size() > 7 ? f[7] : "";
          std::string slots = f.size() > 8 ? f[8] : "";
          std::string morning = f.size() > 9 ? f[9] : "";
          std::string afternoon = f.size() > 10 ? f[10] : "";
          std::string night = f.size() > 11 ? f[11] : "";
          int cx = inner_x + (int) i * col_w + col_w / 2;
          if (i > 0) {
            int split_x = inner_x + (int) i * col_w;
            it.filled_rectangle(split_x, CARD_Y + 6, 1, 28, FG);
            it.filled_rectangle(split_x, CARD_Y + 100, 1, TOP_H - 112, FG);
            if (!nights.empty() && !nights.back().empty())
              weather_icon(split_x, CARD_Y + 64, 22, nights.back());
          }
          nights.push_back(night);
          it.print(cx, CARD_Y + 6, id(font_label), FG, TextAlign::TOP_CENTER, day.c_str());
          if (!morning.empty() && !afternoon.empty()) {
            weather_icon(cx - 22, CARD_Y + 64, 26, morning);
            weather_icon(cx + 22, CARD_Y + 64, 26, afternoon);
          } else {
            weather_icon(cx, CARD_Y + 64, 34, cond);
          }
          std::string temps;
          if (!high.empty()) temps += high + "°";
          if (!low.empty()) temps += (temps.empty() ? "" : "  ") + low + "°";
          if (!temps.empty())
            it.print(cx, CARD_Y + 92, id(font_meta), FG, TextAlign::TOP_CENTER, temps.c_str());

          int slot_h[8] = {0, 0, 0, 0, 0, 0, 0, 0};
          int slot_i = 0;
          int slot_cur = 0;
          bool slot_any = false;
          for (char ch : slots) {
            if (ch >= '0' && ch <= '9') {
              slot_cur = slot_cur * 10 + (ch - '0');
              slot_any = true;
            } else if (ch == ',') {
              if (slot_i < 8) slot_h[slot_i] = slot_any ? slot_cur : 0;
              slot_i++;
              slot_cur = 0;
              slot_any = false;
            }
          }
          if (slot_i < 8 && slot_any) slot_h[slot_i] = slot_cur;

          const int track_h = 28;
          const int base = CARD_Y + 150;
          const int bars_w = col_w - 18;
          const int gap = 2;
          const int slot_w = (bars_w - 7 * gap) / 8;
          int x0 = cx - (8 * slot_w + 7 * gap) / 2;
          it.line(x0, base, x0 + 8 * slot_w + 7 * gap, base, FG);
          for (int s = 0; s < 8; s++) {
            if (slot_h[s] <= 0) continue;
            int bh = track_h * slot_h[s] / 100;
            if (bh < 3) bh = 3;
            it.filled_rectangle(x0 + s * (slot_w + gap), base - bh, slot_w, bh, FG);
          }

          it.print(cx, CARD_Y + 154, id(font_meta), FG, TextAlign::TOP_CENTER, liter(rain).c_str());

          std::string extra;
          if (!sun.empty() && sun != "-") extra = sun;
          if (!wind.empty() && wind != "-") {
            if (!extra.empty()) extra += "  ";
            extra += wind;
          }
          if (!extra.empty())
            it.print(cx, CARD_Y + 178, id(font_meta), FG, TextAlign::TOP_CENTER, extra.c_str());
        }
      }

      auto hour_entries = split_entries(id(wetter_stunden_text).has_state() ? id(wetter_stunden_text).state : "");
      if (!id(wetter_stunden_text).has_state()) {
        it.print(inner_x, BOT_Y + 70, id(font_desc), FG, "warte auf Home Assistant");
      } else if (hour_entries.empty()) {
        it.print(inner_x, BOT_Y + 70, id(font_desc), FG, "keine Stundenwerte");
      } else {
        if (hour_entries.size() > 16) hour_entries.resize(16);
        int col_w = inner_w / (int) hour_entries.size();
        for (size_t i = 0; i < hour_entries.size(); i++) {
          auto f = split_fields(hour_entries[i]);
          std::string clock = f.size() > 0 ? f[0] : "";
          std::string cond = f.size() > 1 ? f[1] : "";
          std::string temp = f.size() > 2 ? f[2] : "";
          std::string rain = f.size() > 3 ? f[3] : "";
          int rain_h = 0;
          if (f.size() > 4) rain_h = atoi(f[4].c_str());
          else {
            float mm = strtof(rain.c_str(), nullptr);
            if (mm > 0.f) rain_h = mm >= 10.f ? 100 : (int) (mm / 10.f * 100.f);
          }
          int cx = inner_x + (int) i * col_w + col_w / 2;
          weather_icon(cx, BOT_Y + 48, 26, cond);
          it.print(cx, BOT_Y + 68, id(font_meta), FG, TextAlign::TOP_CENTER, clock.c_str());
          if (!temp.empty())
            it.print(cx, BOT_Y + 92, id(font_desc), FG, TextAlign::TOP_CENTER, (temp + "°").c_str());
          const int track_h = 26;
          const int base = BOT_Y + 148;
          if (rain_h > 0) {
            int bh = track_h * rain_h / 100;
            if (bh < 3) bh = 3;
            it.filled_rectangle(cx - 7, base - bh, 14, bh, FG);
          }
          it.print(cx, BOT_Y + 152, id(font_meta), FG, TextAlign::TOP_CENTER, liter(rain).c_str());
        }
      }
      }
